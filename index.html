<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jersey+25&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-bg: #f8f7f3;
        --color-text: #231d19;
      }
      * {
        text-box-trim: trim-both;
        text-box-edge: cap alphabetic;
        font-family: "Jersey 25", sans-serif;
        font-weight: 400;
        font-style: normal;
      }
    </style>
    <link rel="stylesheet" href="style.css" />
    <title>Porichoy</title>
  </head>
  <body class="bg-bg flex flex-col gap-6 justify-center h-screen items-center">
    <h1 class="text-4xl">Add Details and Get your custom card</h1>
    <form
      id="form"
      action=""
      class="flex flex-col justify-center items-center gap-3"
    >
      <div
        class="bg-[#faf4dc] w-130 h-85 rounded-xl border-4 border-[#231d19] grid grid-rows-2 p-3"
      >
        <div class="grid grid-cols-16">
          <div class="col-span-5 flex justify-center items-center">
            <div
              id="img"
              class="w-[100%] h-[100%] border-[3.5px] border-[#231d19] rounded-lg flex justify-center items-center p-5 text-center"
            >
              Click to add Image
            </div>
            <input
              type="file"
              name="img"
              accept="image/jpeg image/png image/wep"
              id="file"
              class="hidden"
            />
          </div>
          <div class="col-span-11 flex flex-col gap-2 px-4 py-3">
            <input
              type="text"
              id="name"
              placeholder="Write your name..."
              class="border-[3.5px] rounded-lg w-[75%] h-9 pl-2"
              required
            />
            <textarea
              name="description"
              id="desc"
              placeholder="Write your description..."
              class="border-[3.5px] rounded-lg w-[90%] h-20 pl-2 resize-none"
              required
            ></textarea>
          </div>
        </div>
        <div class="flex flex-col gap-3 justify-center">
          <div class="flex gap-2 items-center">
            <h2>Email:</h2>
            <input
              type="email"
              name="email"
              id="email"
              placeholder="Email"
              class="border-[3.5px] rounded-lg w-[55%] h-7 pl-2"
              required
            />
          </div>
          <div class="flex gap-2 items-center">
            <h2>Contact:</h2>
            <input
              type="tel"
              name="contact"
              id="phone"
              placeholder="Contact"
              class="border-[3.5px] rounded-lg w-[55%] h-7 pl-2"
              required
            />
          </div>
          <div class="flex gap-2 items-center">
            <h2>Address:</h2>
            <input
              type="text"
              name="address"
              id="address"
              placeholder="Address"
              class="border-[3.5px] rounded-lg w-[55%] h-7 pl-2"
              required
            />
          </div>
        </div>
      </div>
      <input
        type="submit"
        placeholder="Build"
        class="px-6 py-3 border-2 border-[#231d19] rounded-lg active:bg-[#faf4dc] duration-75"
      />
    </form>
    <script src="html2canvas.js"></script>
    <script src="index.js"></script>
  </body>
</html>
